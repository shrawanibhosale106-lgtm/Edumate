<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF8">
    <title>EduMate - Student Progress</title>

    
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#f4f7fb,#eef3ff);
    color:#172033;
    padding:25px;
}
.container{max-width:1200px;margin:auto}
.header{
    background:white;padding:25px;border-radius:20px;margin-bottom:20px;
    box-shadow:0 6px 20px rgba(0,0,0,.08);
}
h1{font-size:30px;margin-bottom:8px}
.subtitle{color:#667085}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.toolbar select,.toolbar button{
    padding:11px 14px;border:1px solid #d9deea;border-radius:10px;
    background:white;cursor:pointer;font-size:14px;
}
.toolbar button{background:#172033;color:white;border:none}
.no-students,.loading{
    background:white;padding:35px;text-align:center;border-radius:18px;
    color:#667085;box-shadow:0 5px 18px rgba(0,0,0,.06)
}
.student-card{
    background:white;padding:24px;border-radius:20px;margin-bottom:25px;
    box-shadow:0 6px 22px rgba(0,0,0,.08)
}
.student-top{
    display:flex;justify-content:space-between;align-items:center;gap:20px;
    flex-wrap:wrap;border-bottom:1px solid #edf0f5;padding-bottom:20px
}
.student-name{font-size:23px;font-weight:bold}
.info{color:#667085;margin-top:7px}
.overall-wrap{display:flex;align-items:center;gap:15px}
.overall-circle{
    width:86px;height:86px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;background:#eef4ff;border:8px solid #4f7cff;
    font-size:20px;font-weight:bold
}
.overall-label{font-size:13px;color:#667085}
.stats{
    display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:20px 0
}
.stat{
    padding:16px;border-radius:14px;background:#f8f9fc;border:1px solid #edf0f5
}
.stat-icon{font-size:22px}.stat-title{font-size:12px;color:#667085;margin-top:7px}
.stat-value{font-size:20px;font-weight:bold;margin-top:4px}
.section-title{font-size:18px;margin:22px 0 13px}
.progress-grid{
    display:grid;grid-template-columns:repeat(2,1fr);gap:14px
}
.progress-item{
    padding:16px;border:1px solid #edf0f5;border-radius:14px;background:#fff
}
.progress-header{
    display:flex;justify-content:space-between;margin-bottom:8px;font-weight:bold
}
.bar{width:100%;height:12px;background:#e8ebf1;border-radius:10px;overflow:hidden}
.fill{height:100%;background:#4f7cff;border-radius:10px;transition:width .4s}
.insights{
    display:grid;grid-template-columns:repeat(3,1fr);gap:14px
}
.insight{
    padding:16px;border-radius:14px;background:#f8f9fc;border:1px solid #edf0f5
}
.insight strong{display:block;margin-bottom:6px}
.insight p{font-size:13px;color:#667085;line-height:1.5}
.subject-table{width:100%;border-collapse:collapse;margin-top:10px}
.subject-table th,.subject-table td{
    padding:11px;text-align:left;border-bottom:1px solid #edf0f5;font-size:14px
}
.subject-table th{color:#667085;background:#fafbfc}
.badge{
    display:inline-block;padding:5px 9px;border-radius:20px;
    font-size:12px;background:#eef4ff
}
.back-btn{
    display:block;margin:25px auto;padding:12px 25px;border:none;border-radius:10px;
    background:#172033;color:white;font-size:15px;cursor:pointer
}
.empty-note{color:#667085;font-size:14px;padding:10px 0}
@media(max-width:900px){
    .stats{grid-template-columns:repeat(3,1fr)}
    .insights{grid-template-columns:1fr}
}
@media(max-width:650px){
    body{padding:12px}
    .stats,.progress-grid{grid-template-columns:1fr}
    h1{font-size:24px}
    .student-card,.header{padding:18px}
}
</style>

</head>


<body>
<div class="container">

    <div class="header">
        <h1>📊 Student Progress & Analytics</h1>
        <p class="subtitle">
            Monitor learning activity, performance, completion and improvement areas.
        </p>

        <div class="toolbar">
            <select id="studentFilter">
                <option value="all">All Students</option>
            </select>
            <button onclick="refreshProgress()">🔄 Refresh</button>
        </div>
    </div>

    <div id="studentsContainer">
        <div class="loading">Loading student progress...</div>
    </div>

    <button class="back-btn" onclick="goBack()">← Back to Teacher Dashboard</button>
</div>

<script>
/* =========================
   TEACHER LOGIN
========================= */
let currentUser = JSON.parse(localStorage.getItem("currentUser"));

if (!currentUser) {
    window.location.href = "index.html";
}

/* =========================
   HELPERS
========================= */
function readJSON(key, fallback) {
    try {
        const value = JSON.parse(localStorage.getItem(key));
        return value ?? fallback;
    } catch (e) {
        return fallback;
    }
}

function safeNumber(value) {
    const n = Number(value);
    return Number.isFinite(n) ? n : 0;
}

function escapeHTML(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function clamp(value) {
    return Math.max(0, Math.min(100, Math.round(safeNumber(value))));
}

/* =========================
   LOAD STUDENTS
========================= */
let users = readJSON("users", []);
let students = users.filter(function(user) {
    return user.role == "Student";
});

const container = document.getElementById("studentsContainer");
const studentFilter = document.getElementById("studentFilter");

function setupStudentFilter() {
    studentFilter.innerHTML = '<option value="all">All Students</option>';

    students.forEach(function(student, index) {
        const option = document.createElement("option");
        option.value = String(index);
        option.textContent = student.name || student.email || "Student";
        studentFilter.appendChild(option);
    });
}

/* =========================
   STUDENT DATA
   ========================= */
function getStudentData(student) {

    /*
      IMPORTANT:
      The current project stores many values in general localStorage keys.
      We preserve that behavior for now rather than pretending the data
      is already student-specific.
    */

    const allDoubts = readJSON("doubts", []);
    const studentDoubts = allDoubts.filter(function(doubt) {
        return doubt.studentEmail == student.email;
    });

    const answeredDoubts = studentDoubts.filter(function(doubt) {
        return doubt.status == "Answered";
    });

    const doubtProgress = studentDoubts.length
        ? clamp((answeredDoubts.length / studentDoubts.length) * 100)
        : 0;

    const learnProgress = clamp(localStorage.getItem("learnProgress"));

    const practicalCount = safeNumber(localStorage.getItem("practicalCount"));
    const practicalProgress = practicalCount > 0 ? 100 : 0;

    const vivaData = readJSON("vivaScore", null);
    let vivaProgress = 0;

    if (vivaData && safeNumber(vivaData.total) > 0) {
        vivaProgress = clamp(
            (safeNumber(vivaData.score) / safeNumber(vivaData.total)) * 100
        );
    }

    const plans = readJSON("studyPlans", []);
    const planProgress = plans.length > 0 ? 100 : 0;

    /*
      Assignment information is read when available.
      This keeps the progress page compatible with the existing project
      without requiring an immediate change to other files.
    */
    const assignments = readJSON("eduMateAssignments", []);
    const submissions = readJSON("eduMateSubmissions", []);

    const studentSubmissions = submissions.filter(function(item) {
        return item.studentEmail == student.email ||
               item.email == student.email ||
               item.student == student.email;
    });

    const assignmentCount = assignments.length;
    const submittedCount = studentSubmissions.length;

    let assignmentProgress = 0;
    if (assignmentCount > 0) {
        assignmentProgress = clamp((submittedCount / assignmentCount) * 100);
    } else if (submittedCount > 0) {
        assignmentProgress = 100;
    }

    const overall = clamp(
        (
            learnProgress +
            practicalProgress +
            vivaProgress +
            doubtProgress +
            planProgress +
            assignmentProgress
        ) / 6
    );

    return {
        learnProgress,
        practicalProgress,
        vivaProgress,
        doubtProgress,
        planProgress,
        assignmentProgress,
        overall,
        practicalCount,
        studentDoubts: studentDoubts.length,
        answeredDoubts: answeredDoubts.length,
        vivaScore: vivaData ? safeNumber(vivaData.score) : 0,
        vivaTotal: vivaData ? safeNumber(vivaData.total) : 0,
        assignmentCount,
        submittedCount
    };
}

/* =========================
   PROGRESS BAR
========================= */
function progressBlock(title, value, icon) {
    return `
        <div class="progress-item">
            <div class="progress-header">
                <span>${icon} ${title}</span>
                <span>${value}%</span>
            </div>
            <div class="bar">
                <div class="fill" style="width:${value}%"></div>
            </div>
        </div>
    `;
}

/* =========================
   STUDENT CARD
========================= */
function createStudentCard(student) {

    const data = getStudentData(student);

    let focusArea = "Keep learning consistently.";
    let lowest = Math.min(
        data.learnProgress,
        data.practicalProgress,
        data.vivaProgress,
        data.doubtProgress,
        data.planProgress,
        data.assignmentProgress
    );

    if (lowest == data.learnProgress) {
        focusArea = "Learning completion needs more attention.";
    } else if (lowest == data.practicalProgress) {
        focusArea = "Complete practical work regularly.";
    } else if (lowest == data.vivaProgress) {
        focusArea = "Practice more viva questions.";
    } else if (lowest == data.doubtProgress) {
        focusArea = "Try to resolve pending doubts.";
    } else if (lowest == data.planProgress) {
        focusArea = "Create and follow a study plan.";
    } else if (lowest == data.assignmentProgress) {
        focusArea = "Focus on pending assignments.";
    }

    let performanceText = "Progress is being tracked.";
    if (data.overall >= 80) {
        performanceText = "Strong overall progress.";
    } else if (data.overall >= 60) {
        performanceText = "Moderate progress; consistency can improve.";
    } else {
        performanceText = "Several learning areas need attention.";
    }

    return `
        <div class="student-card">

            <div class="student-top">
                <div>
                    <div class="student-name">
                        👩‍🎓 ${escapeHTML(student.name || "Student")}
                    </div>
                    <p class="info">📧 ${escapeHTML(student.email || "No email")}</p>
                </div>

                <div class="overall-wrap">
                    <div class="overall-circle">${data.overall}%</div>
                    <div>
                        <div class="overall-label">OVERALL</div>
                        <strong>Student Progress</strong>
                    </div>
                </div>
            </div>

            <div class="stats">
                <div class="stat">
                    <div class="stat-icon">📚</div>
                    <div class="stat-title">Learning</div>
                    <div class="stat-value">${data.learnProgress}%</div>
                </div>

                <div class="stat">
                    <div class="stat-icon">🧪</div>
                    <div class="stat-title">Practicals</div>
                    <div class="stat-value">${data.practicalProgress}%</div>
                </div>

                <div class="stat">
                    <div class="stat-icon">🎤</div>
                    <div class="stat-title">Viva</div>
                    <div class="stat-value">${data.vivaProgress}%</div>
                </div>

                <div class="stat">
                    <div class="stat-icon">📝</div>
                    <div class="stat-title">Assignments</div>
                    <div class="stat-value">${data.assignmentProgress}%</div>
                </div>

                <div class="stat">
                    <div class="stat-icon">❓</div>
                    <div class="stat-title">Doubts</div>
                    <div class="stat-value">${data.doubtProgress}%</div>
                </div>
            </div>

            <h3 class="section-title">📈 Progress Breakdown</h3>

            <div class="progress-grid">
                ${progressBlock("Learning", data.learnProgress, "📚")}
                ${progressBlock("Practicals", data.practicalProgress, "🧪")}
                ${progressBlock("Viva", data.vivaProgress, "🎤")}
                ${progressBlock("Assignments", data.assignmentProgress, "📝")}
                ${progressBlock("Doubts", data.doubtProgress, "❓")}
                ${progressBlock("Study Plans", data.planProgress, "📅")}
            </div>

            <h3 class="section-title">🔎 Performance Insights</h3>

            <div class="insights">
                <div class="insight">
                    <strong>📌 Current Status</strong>
                    <p>${performanceText}</p>
                </div>

                <div class="insight">
                    <strong>🎯 Focus Area</strong>
                    <p>${focusArea}</p>
                </div>

                <div class="insight">
                    <strong>📊 Activity Summary</strong>
                    <p>
                        ${data.studentDoubts} doubts,
                        ${data.submittedCount} submissions,
                        ${data.practicalCount} practical activity entries.
                    </p>
                </div>
            </div>

            <h3 class="section-title">📋 Activity Details</h3>

            <table class="subject-table">
                <thead>
                    <tr>
                        <th>Activity</th>
                        <th>Current Data</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Viva</td>
                        <td>${data.vivaScore} / ${data.vivaTotal}</td>
                        <td><span class="badge">${data.vivaProgress}%</span></td>
                    </tr>
                    <tr>
                        <td>Doubts</td>
                        <td>${data.answeredDoubts} / ${data.studentDoubts} answered</td>
                        <td><span class="badge">${data.doubtProgress}%</span></td>
                    </tr>
                    <tr>
                        <td>Assignments</td>
                        <td>${data.submittedCount} / ${data.assignmentCount} submitted</td>
                        <td><span class="badge">${data.assignmentProgress}%</span></td>
                    </tr>
                    <tr>
                        <td>Study Plans</td>
                        <td>${data.planProgress == 100 ? "Created" : "Not created"}</td>
                        <td><span class="badge">${data.planProgress}%</span></td>
                    </tr>
                </tbody>
            </table>

        </div>
    `;
}

/* =========================
   RENDER
========================= */
function refreshProgress() {

    users = readJSON("users", []);
    students = users.filter(function(user) {
        return user.role == "Student";
    });

    setupStudentFilter();

    if (students.length == 0) {
        container.innerHTML = `
            <div class="no-students">
                <h2>No students registered yet.</h2>
                <p>Student progress will appear here.</p>
            </div>
        `;
        return;
    }

    const selected = studentFilter.value;

    if (selected !== "all" && students[selected]) {
        container.innerHTML = createStudentCard(students[selected]);
        studentFilter.value = selected;
        return;
    }

    container.innerHTML = students.map(function(student) {
        return createStudentCard(student);
    }).join("");
}

/* =========================
   FILTER
========================= */
studentFilter.addEventListener("change", refreshProgress);

/* =========================
   BACK
========================= */
function goBack() {
    window.location.href = "teacher.html";
}

refreshProgress();
</script>
</body>

</html>
