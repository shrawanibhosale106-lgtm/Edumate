<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF8">
    <title>EduMate - Student Doubts</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #555;
            margin-bottom: 25px;
        }

        .doubt-card {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px #ccc;
        }

        .doubt-card h3 {
            margin-bottom: 10px;
        }

        .doubt-card p {
            margin: 8px 0;
            line-height: 1.5;
        }

        textarea {
            width: 100%;
            height: 90px;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #aaa;
            border-radius: 6px;
            resize: vertical;
        }

        button {
            padding: 10px 18px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            background-color: #333;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }

        .status {
            font-weight: bold;
        }

        .pending {
            color: orange;
        }

        .answered {
            color: green;
        }

        .empty {
            background-color: white;
            padding: 25px;
            text-align: center;
            border-radius: 12px;
            color: #666;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>❓ Student Doubts</h1>

    <p class="subtitle">
        View and answer student doubts
    </p>

    <div id="doubtList"></div>

    <button onclick="goBack()">
        ← Back to Teacher Dashboard
    </button>

</div>


<script>

// ==========================================
// CHECK TEACHER LOGIN
// ==========================================

let currentUser =
    JSON.parse(localStorage.getItem("currentUser"));

if (!currentUser) {

    window.location.href = "index.html";

}


// ==========================================
// LOAD DOUBTS
// ==========================================

function loadDoubts() {

    let doubts =
        JSON.parse(localStorage.getItem("doubts")) || [];

    let list =
        document.getElementById("doubtList");

    list.innerHTML = "";


    // No doubts

    if (doubts.length == 0) {

        list.innerHTML =
            `<div class="empty">
                No student doubts available.
            </div>`;

        return;

    }


    // Display doubts

    doubts.forEach(function(doubt, index) {

        let card =
            document.createElement("div");

        card.className = "doubt-card";


        let statusClass =
            doubt.status == "Answered"
            ? "answered"
            : "pending";


        let answerSection = "";


        // If already answered

        if (doubt.status == "Answered") {

            answerSection =

                `<p>
                    <strong>Teacher Answer:</strong><br>
                    ${doubt.answer}
                </p>

                <p class="status ${statusClass}">
                    Status: Answered ✅
                </p>`;

        }


        // If pending

        else {

            answerSection =

                `<textarea
                    id="answer-${index}"
                    placeholder="Write your answer here...">
                </textarea>

                <button
                    onclick="answerDoubt(${index})">
                    Answer Doubt
                </button>

                <p class="status ${statusClass}">
                    Status: Pending
                </p>`;

        }


        card.innerHTML =

            `<h3>
                ${doubt.subject}
            </h3>

            <p>
                <strong>Student:</strong>
                ${doubt.studentName}
            </p>

            <p>
                <strong>Topic:</strong>
                ${doubt.topic}
            </p>

            <p>
                <strong>Doubt:</strong><br>
                ${doubt.doubt}
            </p>

            ${answerSection}`;


        list.appendChild(card);

    });

}


// ==========================================
// ANSWER DOUBT
// ==========================================

function answerDoubt(index) {

    let doubts =
        JSON.parse(localStorage.getItem("doubts")) || [];


    let answer =
        document.getElementById(
            "answer-" + index
        ).value.trim();


    if (answer == "") {

        alert("Please write an answer.");

        return;

    }


    doubts[index].answer = answer;

    doubts[index].status = "Answered";

    doubts[index].teacherName =
        currentUser.name;


    localStorage.setItem(
        "doubts",
        JSON.stringify(doubts)
    );


    alert("Answer submitted successfully! ✅");


    loadDoubts();

}


// ==========================================
// BACK
// ==========================================

function goBack() {

    window.location.href =
        "teacher.html";

}


// ==========================================
// LOAD ON PAGE OPEN
// ==========================================

loadDoubts();

</script>

</body>

</html>
