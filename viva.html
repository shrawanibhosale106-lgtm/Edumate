let currentUser = JSON.parse(localStorage.getItem("currentUser"));
if (!currentUser) window.location.href = "index.html";

let selectedSubject="", selectedTopic="", selectedType="";
let questions=[], currentQuestion=0, score=0, results=[];

function getTeacherQuestions(){
    return JSON.parse(localStorage.getItem("eduMateVivaQuestions")) || [];
}

function loadTopics(){
    selectedSubject=document.getElementById("subject").value;
    const topic=document.getElementById("topic");
    const msg=document.getElementById("setupMessage");
    topic.innerHTML='<option value="">-- Select Topic --</option>';
    msg.textContent="";
    if(!selectedSubject){topic.disabled=true;return;}
    let topics=[...(topicMap[selectedSubject]||[])];
    getTeacherQuestions().forEach(q=>{
        if(String(q.subject||"").trim()===selectedSubject && q.topic && !topics.includes(q.topic)) topics.push(q.topic);
    });
    topics.forEach(t=>{
        const o=document.createElement("option"); o.value=t; o.textContent=t; topic.appendChild(o);
    });
    topic.disabled=false;
    msg.textContent=topics.length+" topic(s) available.";
}

function startQuiz(){
    selectedSubject=document.getElementById("subject").value;
    selectedTopic=document.getElementById("topic").value;
    selectedType=document.getElementById("questionType").value;
    if(!selectedSubject){alert("Please select a subject.");return;}
    if(!selectedTopic){alert("Please select a topic.");return;}
    questions=[];
    if(selectedType==="builtin"||selectedType==="all"){
        vivaData.forEach(q=>{
            if(q.subject===selectedSubject && q.topic===selectedTopic)
                questions.push({question:q.question,answer:q.answer,topic:q.topic,source:"Built-in"});
        });
    }
    if(selectedType==="teacher"||selectedType==="all"){
        getTeacherQuestions().forEach(q=>{
            if(String(q.subject||"").trim()===selectedSubject && String(q.topic||"").trim()===selectedTopic)
                questions.push({question:q.question,answer:q.answer,topic:q.topic,source:"Teacher Added"});
        });
    }
    if(!questions.length){
        alert("No questions are available for this selection.");
        document.getElementById("setupMessage").textContent="No questions are available for this topic.";
        return;
    }
    currentQuestion=0;score=0;results=[];
    document.getElementById("setupBox").style.display="none";
    document.getElementById("resultBox").style.display="none";
    document.getElementById("quizBox").style.display="block";
    showQuestion();
}

function showQuestion(){
    const q=questions[currentQuestion];
    document.getElementById("questionNumber").textContent="Question "+(currentQuestion+1)+" of "+questions.length;
    const badge=document.getElementById("sourceBadge");
    badge.textContent=q.source==="Teacher Added"?"👩‍🏫 Teacher Added":"📚 Built-in";
    badge.className="badge "+(q.source==="Teacher Added"?"teacher-badge":"builtin-badge");
    document.getElementById("topicBadge").textContent="📖 "+q.topic;
    document.getElementById("question").textContent=q.question;
    document.getElementById("studentAnswer").value="";
    document.getElementById("studentAnswer").disabled=false;
    document.getElementById("submitButton").style.display="inline-block";
    document.getElementById("nextButton").style.display="none";
    document.getElementById("feedback").style.display="none";
    document.getElementById("answerBox").style.display="none";
}

function normalizeAnswer(s){
    return String(s||"").toLowerCase().trim().replace(/[.,!?;:]/g,"").replace(/\s+/g," ");
}

function getKeywords(answer){
    return normalizeAnswer(answer)
      .replace(/\([^)]*\)/g," ")
      .split(/\s+/)
      .filter(w=>w.length>=5)
      .filter((w,i,a)=>a.indexOf(w)===i)
      .slice(0,12);
}

function checkAnswer(student, correct){
    if(student===correct || student.includes(correct) || correct.includes(student)) return true;
    const keys=getKeywords(correct);
    if(!keys.length) return false;
    let hits=keys.filter(k=>student.includes(k)).length;
    return hits >= Math.max(2, Math.ceil(keys.length*0.35));
}

function formatAnswer(text){
    // Preserve theory and ASCII diagrams while escaping HTML.
    const escaped=escapeHTML(text);
    return escaped.replace(/(Diagram:|Flow:|Example:|Equations:|Operation:|Basic flow:|Register grouping:|Main functions:|Advantages:|Common types:)/g,"<br><strong>$1</strong>");
}

function submitAnswer(){
    const q=questions[currentQuestion];
    const raw=document.getElementById("studentAnswer").value.trim();
    if(!raw){alert("Please enter your answer.");return;}
    const isCorrect=checkAnswer(normalizeAnswer(raw),normalizeAnswer(q.answer));
    if(isCorrect){
        score++;
        document.getElementById("feedback").className="feedback correct";
        document.getElementById("feedback").innerHTML="✅ Correct! <strong>+1 mark</strong>";
    }else{
        document.getElementById("feedback").className="feedback wrong";
        document.getElementById("feedback").innerHTML="❌ Your answer does not sufficiently match the model answer. <strong>0 marks</strong>";
    }
    results.push({question:q.question,studentAnswer:raw,correctAnswer:q.answer,correct:isCorrect,source:q.source,topic:q.topic});
    document.getElementById("feedback").style.display="block";
    document.getElementById("correctAnswer").innerHTML=formatAnswer(q.answer);
    document.getElementById("answerBox").style.display="block";
    document.getElementById("studentAnswer").disabled=true;
    document.getElementById("submitButton").style.display="none";
    document.getElementById("nextButton").style.display="inline-block";
}

function nextQuestion(){
    currentQuestion++;
    if(currentQuestion<questions.length) showQuestion();
    else showResult();
}

function showResult(){
    const total=questions.length, percentage=Math.round(score/total*100);
    document.getElementById("quizBox").style.display="none";
    document.getElementById("resultBox").style.display="block";
    document.getElementById("score").textContent="Score: "+score+" / "+total;
    document.getElementById("percentage").textContent="Percentage: "+percentage+"%";
    document.getElementById("message").textContent=percentage>=80?"🌟 Excellent! Keep practicing.":percentage>=50?"👍 Good work! Practice more to improve.":"📚 Keep practicing. You can improve.";
    if(currentUser && currentUser.email){
        localStorage.setItem("vivaScore_"+currentUser.email,JSON.stringify({subject:selectedSubject,topic:selectedTopic,type:selectedType,score,total,percentage}));
    }
    showReview();
}

function showReview(){
    const box=document.getElementById("reviewBox");
    box.innerHTML="<h3>📋 Answer Review</h3>";
    results.forEach((r,i)=>{
        const div=document.createElement("div");
        div.className="review-item "+(r.correct?"review-correct":"review-wrong");
        div.innerHTML="<strong>Q"+(i+1)+":</strong> "+escapeHTML(r.question)+
          "<br><br><strong>Your Answer:</strong> "+escapeHTML(r.studentAnswer)+
          "<br><br><strong>Model Answer:</strong><div class='answer-content'>"+formatAnswer(r.correctAnswer)+"</div>"+
          "<br><strong>Source:</strong> "+escapeHTML(r.source)+
          "<br><strong>Topic:</strong> "+escapeHTML(r.topic);
        box.appendChild(div);
    });
}

function escapeHTML(text){
    const div=document.createElement("div"); div.textContent=text||""; return div.innerHTML;
}

function restartQuiz(){
    document.getElementById("resultBox").style.display="none";
    document.getElementById("quizBox").style.display="none";
    document.getElementById("setupBox").style.display="block";
    document.getElementById("subject").value="";
    document.getElementById("topic").innerHTML='<option value="">-- Select Topic --</option>';
    document.getElementById("topic").disabled=true;
    document.getElementById("setupMessage").textContent="";
}

function goBack(){
    window.location.assign("student.html");
}

document.addEventListener("DOMContentLoaded",()=>{
    document.getElementById("topic").disabled=true;
});
</script>
