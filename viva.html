<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduMate - Viva Practice</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f4f6f9;
    margin: 0;
    padding: 20px;
}
.container {
    max-width: 850px;
    margin: auto;
}
h1 { text-align: center; }
.box {
    background-color: white;
    padding: 25px;
    margin-top: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
label {
    display: block;
    font-weight: bold;
    margin-top: 15px;
}
select, textarea {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    margin-top: 8px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 7px;
}
textarea {
    min-height: 120px;
    resize: vertical;
}
button {
    padding: 10px 18px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    margin-top: 15px;
    margin-right: 8px;
    background-color: #263238;
    color: white;
}
button:hover { opacity: 0.85; }
.secondary { background-color: #607d8b; }
.quiz, .result { display: none; }
.question {
    font-size: 21px;
    font-weight: bold;
    margin-top: 15px;
    line-height: 1.5;
}
.badge {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 20px;
    background-color: #eeeeee;
    font-size: 13px;
    margin: 4px 5px 8px 0;
}
.teacher-badge {
    background-color: #eadcf4;
}
.builtin-badge {
    background-color: #dcecff;
}
.feedback {
    padding: 15px;
    margin-top: 15px;
    border-radius: 8px;
    display: none;
}
.correct {
    background-color: #e8f5e9;
    border: 1px solid #66bb6a;
}
.wrong {
    background-color: #ffebee;
    border: 1px solid #ef5350;
}
.answer-box {
    background-color: #f1f5f9;
    padding: 15px;
    margin-top: 15px;
    border-radius: 8px;
    display: none;
}
.score {
    font-size: 28px;
    font-weight: bold;
}
.small-text {
    color: #666;
    font-size: 14px;
}
.review-item {
    padding: 12px;
    margin-top: 10px;
    border-radius: 8px;
    background-color: #f7f7f7;
}
.review-correct { border-left: 5px solid #43a047; }
.review-wrong { border-left: 5px solid #e53935; }
.no-questions {
    color: #777;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎤 EduMate Viva Practice</h1>

<button type="button" class="secondary" onclick="goBack()">← Back to Student Dashboard</button>

<!-- SETUP -->
<div class="box" id="setupBox">

    <h2>Start Viva Practice</h2>

    <label for="subject">Select Subject</label>
    <select id="subject" onchange="loadTopics()">
        <option value="">-- Select Subject --</option>
        <option value="DBMS">DBMS</option>
        <option value="DLD">DLD</option>
        <option value="OOP">OOP</option>
        <option value="JavaScript">JavaScript</option>
        <option value="Computer Networks">Computer Networks</option>
        <option value="C Programming">C Programming</option>
    </select>

    <label for="topic">Select Topic</label>
    <select id="topic">
        <option value="">-- Select Topic --</option>
    </select>

    <label for="questionType">Question Type</label>
    <select id="questionType">
        <option value="builtin">📚 Built-in Questions</option>
        <option value="teacher">👩‍🏫 Teacher Added Questions</option>
        <option value="all">📖 All Questions</option>
    </select>

    <button type="button" onclick="startQuiz()">Start Viva</button>

    <p id="setupMessage" class="small-text"></p>

</div>

<!-- QUIZ -->
<div class="box quiz" id="quizBox">

    <div>
        <span id="sourceBadge" class="badge"></span>
        <span id="topicBadge" class="badge"></span>
    </div>

    <p id="questionNumber"></p>

    <div class="question" id="question"></div>

    <label for="studentAnswer">Your Answer</label>

    <textarea id="studentAnswer"
        placeholder="Type your answer here..."></textarea>

    <button type="button" onclick="submitAnswer()" id="submitButton">
        Submit Answer
    </button>

    <div id="feedback" class="feedback"></div>

    <div id="answerBox" class="answer-box">
        <strong>Correct Answer:</strong>
        <p id="correctAnswer"></p>
    </div>

    <button type="button" onclick="nextQuestion()" id="nextButton" style="display:none;">
        ➡️ Next Question
    </button>

</div>

<!-- RESULT -->
<div class="box result" id="resultBox">

    <h2>🎉 Viva Completed!</h2>

    <p class="score" id="score"></p>
    <p id="percentage"></p>
    <p id="message"></p>

    <div id="reviewBox"></div>

    <button type="button" onclick="restartQuiz()">🔄 Try Again</button>
    <button type="button" class="secondary" onclick="goBack()">← Student Dashboard</button>

</div>

</div>

<script>

/* ==================================================
   BUILT-IN QUESTIONS
================================================== */

let vivaData = {

    DBMS: [
        {
            topic: "DBMS Basics",
            question: "What is DBMS?",
            answer: "DBMS stands for Database Management System. It is software used to create, store, manage and retrieve data."
        },
        {
            topic: "Database Basics",
            question: "What is a database?",
            answer: "A database is an organized collection of related data."
        },
        {
            topic: "Keys",
            question: "What is a primary key?",
            answer: "A primary key uniquely identifies each record in a table."
        },
        {
            topic: "SQL",
            question: "What is SQL?",
            answer: "SQL stands for Structured Query Language. It is used to communicate with and manage databases."
        },
        {
            topic: "DDL",
            question: "What is DDL?",
            answer: "DDL stands for Data Definition Language. CREATE, ALTER and DROP are examples of DDL commands."
        }
    ],

    DLD: [
        {
            topic: "Logic Gates",
            question: "What is a logic gate?",
            answer: "A logic gate is an electronic circuit that performs a logical operation on binary inputs."
        },
        {
            topic: "Logic Gates",
            question: "What is an AND gate?",
            answer: "An AND gate gives output 1 only when all its inputs are 1."
        },
        {
            topic: "Logic Gates",
            question: "What is an OR gate?",
            answer: "An OR gate gives output 1 when at least one input is 1."
        },
        {
            topic: "Logic Gates",
            question: "What is a NOT gate?",
            answer: "A NOT gate gives the complement of its input."
        },
        {
            topic: "K-map",
            question: "What is a K-map?",
            answer: "A Karnaugh Map is a graphical method used to simplify Boolean expressions."
        }
    ],

    OOP: [
        {
            topic: "C++ Basics",
            question: "What is C++?",
            answer: "C++ is a general-purpose programming language that supports object-oriented programming."
        },
        {
            topic: "Class and Object",
            question: "What is a class?",
            answer: "A class is a user-defined data type that contains data members and member functions."
        },
        {
            topic: "Class and Object",
            question: "What is an object?",
            answer: "An object is an instance of a class."
        },
        {
            topic: "Constructor",
            question: "What is a constructor?",
            answer: "A constructor is a special member function that is automatically called when an object is created."
        },
        {
            topic: "Inheritance",
            question: "What is inheritance?",
            answer: "Inheritance is a feature in which one class acquires the properties and functions of another class."
        }
    ],

    JavaScript: [
        {
            topic: "JavaScript Basics",
            question: "What is JavaScript?",
            answer: "JavaScript is a scripting language used to make webpages interactive."
        },
        {
            topic: "Events",
            question: "What is an event?",
            answer: "An event is an action that occurs on a webpage, such as a click or mouseover."
        },
        {
            topic: "Functions",
            question: "What is a function?",
            answer: "A function is a block of code designed to perform a specific task."
        },
        {
            topic: "Cookies",
            question: "What is a cookie?",
            answer: "A cookie is a small piece of data stored by a website in the user's browser."
        },
        {
            topic: "localStorage",
            question: "What is localStorage?",
            answer: "localStorage allows data to be stored in the browser and keeps it even after the browser is closed."
        }
    ],

    "Computer Networks": [
        {
            topic: "Network Basics",
            question: "What is a computer network?",
            answer: "A computer network is a group of connected devices that communicate and share resources."
        },
        {
            topic: "IP Address",
            question: "What is an IP address?",
            answer: "An IP address is a unique address used to identify a device on a network."
        },
        {
            topic: "TCP",
            question: "What is TCP?",
            answer: "TCP stands for Transmission Control Protocol. It provides reliable and ordered delivery of data."
        },
        {
            topic: "Networking Devices",
            question: "What is a router?",
            answer: "A router is a networking device that forwards data between different networks."
        },
        {
            topic: "LAN",
            question: "What is a LAN?",
            answer: "LAN stands for Local Area Network. It connects devices within a small geographical area."
        }
    ],

    "C Programming": [
        {
            topic: "C Basics",
            question: "What is C?",
            answer: "C is a general-purpose programming language used for developing system and application software."
        },
        {
            topic: "Variables",
            question: "What is a variable?",
            answer: "A variable is a named memory location used to store a value."
        },
        {
            topic: "Functions",
            question: "What is a function?",
            answer: "A function is a block of code designed to perform a specific task."
        },
        {
            topic: "Arrays",
            question: "What is an array?",
            answer: "An array is a collection of elements of the same data type stored in contiguous memory locations."
        },
        {
            topic: "Pointers",
            question: "What is a pointer?",
            answer: "A pointer is a variable that stores the memory address of another variable."
        }
    ]
};


/* ==================================================
   CURRENT USER
================================================== */

let currentUser =
    JSON.parse(localStorage.getItem("currentUser"));

if (!currentUser) {
    window.location.href = "index.html";
}


/* ==================================================
   VARIABLES
================================================== */

let selectedSubject = "";
let selectedTopic = "";
let selectedType = "";

let questions = [];
let currentQuestion = 0;
let score = 0;
let results = [];


/* ==================================================
   GET TEACHER QUESTIONS
================================================== */

function getTeacherQuestions() {

    return JSON.parse(
        localStorage.getItem("eduMateVivaQuestions")
    ) || [];

}


/* ==================================================
   TOPIC LIST
================================================== */

const topicMap = {
    DBMS: ["DBMS Basics", "Database Basics", "Keys", "SQL", "DDL"],
    DLD: ["Logic Gates", "K-map"],
    OOP: ["C++ Basics", "Class and Object", "Constructor", "Inheritance"],
    JavaScript: ["JavaScript Basics", "Events", "Functions", "Cookies", "localStorage"],
    "Computer Networks": ["Network Basics", "IP Address", "TCP", "Networking Devices", "LAN"],
    "C Programming": ["C Basics", "Variables", "Functions", "Arrays", "Pointers"]
};


/* ==================================================
   LOAD TOPICS
================================================== */

function loadTopics() {

    const subjectSelect = document.getElementById("subject");
    const topicSelect = document.getElementById("topic");
    const message = document.getElementById("setupMessage");

    selectedSubject = subjectSelect.value;

    topicSelect.innerHTML = '<option value="">-- Select Topic --</option>';
    message.textContent = "";

    if (!selectedSubject) {
        topicSelect.disabled = true;
        return;
    }

    let topics = [...(topicMap[selectedSubject] || [])];

    // Also include topics added by the teacher.
    getTeacherQuestions().forEach(function(q) {
        if (q.subject === selectedSubject && q.topic && !topics.includes(q.topic)) {
            topics.push(q.topic);
        }
    });

    topics.forEach(function(topic) {
        const option = document.createElement("option");
        option.value = topic;
        option.textContent = topic;
        topicSelect.appendChild(option);
    });

    topicSelect.disabled = false;
    message.textContent = topics.length + " topic(s) available for " + selectedSubject + ".";
}


/* ==================================================
   START QUIZ
================================================== */

function startQuiz() {

    selectedSubject =
        document.getElementById("subject").value;

    selectedTopic =
        document.getElementById("topic").value;

    selectedType =
        document.getElementById("questionType").value;


    if (selectedSubject === "") {

        alert("Please select a subject.");

        return;
    }


    if (selectedTopic === "") {

        alert("Please select a topic.");

        return;
    }


    questions = [];


    /* ==============================================
       BUILT-IN QUESTIONS
    ============================================== */

    if (
        selectedType === "builtin" ||
        selectedType === "all"
    ) {

        let builtIn =
            vivaData[selectedSubject] || [];

        builtIn.forEach(function(q) {

            if (q.topic === selectedTopic) {

                questions.push({

                    question: q.question,
                    answer: q.answer,
                    topic: q.topic,
                    source: "Built-in"

                });

            }

        });

    }


    /* ==============================================
       TEACHER QUESTIONS
    ============================================== */

    if (
        selectedType === "teacher" ||
        selectedType === "all"
    ) {

        let teacherQuestions =
            getTeacherQuestions();

        teacherQuestions.forEach(function(q) {

            if (
                String(q.subject || "").trim() === selectedSubject &&
                String(q.topic || "").trim() === selectedTopic
            ) {

                questions.push({

                    question: q.question,
                    answer: q.answer,
                    topic: q.topic,
                    source: "Teacher Added"

                });

            }

        });

    }


    if (questions.length === 0) {
        document.getElementById("setupMessage").textContent =
            "No questions are available for this subject, topic and question type.";
        alert("No questions are available for this selection.");
        return;
    }

    document.getElementById("setupMessage").textContent = "";


    currentQuestion = 0;
    score = 0;
    results = [];


    document.getElementById("setupBox")
        .style.display = "none";

    document.getElementById("quizBox")
        .style.display = "block";


    showQuestion();

}


/* ==================================================
   SHOW QUESTION
================================================== */

function showQuestion() {

    let q =
        questions[currentQuestion];


    document.getElementById("questionNumber")
        .innerHTML =
        "Question " +
        (currentQuestion + 1) +
        " of " +
        questions.length;


    let sourceBadge =
        document.getElementById("sourceBadge");


    sourceBadge.innerHTML =
        q.source === "Teacher Added"
        ? "👩‍🏫 Teacher Added"
        : "📚 Built-in";


    sourceBadge.className =
        q.source === "Teacher Added"
        ? "badge teacher-badge"
        : "badge builtin-badge";


    document.getElementById("topicBadge")
        .innerHTML =
        "📖 Topic: " + q.topic;


    document.getElementById("question")
        .innerHTML =
        q.question;


    document.getElementById("studentAnswer")
        .value = "";

    document.getElementById("studentAnswer")
        .disabled = false;


    document.getElementById("submitButton")
        .style.display = "inline-block";


    document.getElementById("nextButton")
        .style.display = "none";


    document.getElementById("feedback")
        .style.display = "none";


    document.getElementById("answerBox")
        .style.display = "none";

}


/* ==================================================
   NORMALIZE ANSWER
================================================== */

function normalizeAnswer(answer) {

    return answer
        .toLowerCase()
        .trim()
        .replace(/[.,!?;:]/g, "")
        .replace(/\s+/g, " ");

}


/* ==================================================
   CHECK ANSWER
================================================== */

function submitAnswer() {

    let q =
        questions[currentQuestion];


    let studentAnswer =
        document.getElementById("studentAnswer")
            .value.trim();


    if (studentAnswer === "") {

        alert("Please enter your answer.");

        return;
    }


    let student =
        normalizeAnswer(studentAnswer);

    let correct =
        normalizeAnswer(q.answer);


    /*
       The answer is checked using the complete
       stored answer or matching meaningful text.
    */

    let isCorrect =
        student === correct ||
        student.includes(correct) ||
        correct.includes(student);


    if (isCorrect) {

        score++;

        document.getElementById("feedback")
            .className =
            "feedback correct";

        document.getElementById("feedback")
            .innerHTML =
            "✅ Correct! <strong>+1 mark</strong>";

    }

    else {

        document.getElementById("feedback")
            .className =
            "feedback wrong";

        document.getElementById("feedback")
            .innerHTML =
            "❌ Wrong! <strong>0 marks</strong>";

    }


    results.push({

        question: q.question,

        studentAnswer: studentAnswer,

        correctAnswer: q.answer,

        correct: isCorrect,

        source: q.source,

        topic: q.topic

    });


    document.getElementById("feedback")
        .style.display = "block";


    document.getElementById("correctAnswer")
        .innerHTML =
        escapeHTML(q.answer);


    document.getElementById("answerBox")
        .style.display = "block";


    document.getElementById("studentAnswer")
        .disabled = true;


    document.getElementById("submitButton")
        .style.display = "none";


    document.getElementById("nextButton")
        .style.display = "inline-block";

}


/* ==================================================
   NEXT QUESTION
================================================== */

function nextQuestion() {

    currentQuestion++;


    if (currentQuestion < questions.length) {

        showQuestion();

    }

    else {

        showResult();

    }

}


/* ==================================================
   SHOW RESULT
================================================== */

function showResult() {

    let total =
        questions.length;


    let percentage =
        Math.round(
            (score / total) * 100
        );


    document.getElementById("quizBox")
        .style.display = "none";


    document.getElementById("resultBox")
        .style.display = "block";


    document.getElementById("score")
        .innerHTML =
        "Score: " +
        score +
        " / " +
        total;


    document.getElementById("percentage")
        .innerHTML =
        "Percentage: " +
        percentage +
        "%";


    if (percentage >= 80) {

        document.getElementById("message")
            .innerHTML =
            "🌟 Excellent! Keep practicing.";

    }

    else if (percentage >= 50) {

        document.getElementById("message")
            .innerHTML =
            "👍 Good work! Practice more to improve.";

    }

    else {

        document.getElementById("message")
            .innerHTML =
            "📚 Keep practicing. You can improve.";

    }


    /* Save score */

    localStorage.setItem(

        "vivaScore_" +
        currentUser.email,

        JSON.stringify({

            subject: selectedSubject,

            topic: selectedTopic,

            type: selectedType,

            score: score,

            total: total,

            percentage: percentage

        })

    );


    showReview();

}


/* ==================================================
   ANSWER REVIEW
================================================== */

function showReview() {

    let reviewBox =
        document.getElementById("reviewBox");


    reviewBox.innerHTML =
        "<h3>📋 Answer Review</h3>";


    results.forEach(function(result, index) {

        let div =
            document.createElement("div");


        div.className =
            result.correct
            ? "review-item review-correct"
            : "review-item review-wrong";


        div.innerHTML =

            "<strong>Q" +
            (index + 1) +
            ":</strong> " +
            escapeHTML(result.question) +

            "<br><br>" +

            "<strong>Your Answer:</strong> " +
            escapeHTML(result.studentAnswer) +

            "<br>" +

            "<strong>Correct Answer:</strong> " +
            escapeHTML(result.correctAnswer) +

            "<br>" +

            "<strong>Source:</strong> " +
            escapeHTML(result.source) +

            "<br>" +

            "<strong>Topic:</strong> " +
            escapeHTML(result.topic);


        reviewBox.appendChild(div);

    });

}


/* ==================================================
   ESCAPE HTML
================================================== */

function escapeHTML(text) {

    let div =
        document.createElement("div");

    div.textContent =
        text || "";

    return div.innerHTML;

}


/* ==================================================
   RESTART
================================================== */

function restartQuiz() {

    document.getElementById("resultBox")
        .style.display = "none";


    document.getElementById("quizBox")
        .style.display = "none";


    document.getElementById("setupBox")
        .style.display = "block";


    document.getElementById("subject")
        .value = "";


    document.getElementById("topic")
        .innerHTML =
        '<option value="">-- Select Topic --</option>';

}


/* ==================================================
   BACK TO DASHBOARD
================================================== */

function goBack() {
    // EduMate student dashboard file
    const dashboard = "student.html";

    try {
        window.location.assign(dashboard);
    } catch (error) {
        window.location.href = dashboard;
    }
}


/* ==================================================
   INITIAL SETUP
================================================== */

document.addEventListener("DOMContentLoaded", function() {
    document.getElementById("topic").disabled = true;
});

</script>

</body>
</html>
