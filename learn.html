<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>EduMate - AI Learn</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        header {
            background-color: #263238;
            color: white;
            text-align: center;
            padding: 20px;
        }

        header h1 {
            margin-bottom: 5px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 20px;
        }

        .section {
            margin-top: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .card {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px #cccccc;
            cursor: pointer;
            transition: 0.2s;
        }

        .card:hover {
            background-color: #e3f2fd;
            transform: translateY(-2px);
        }

        .card h3 {
            margin-top: 8px;
        }

        /* Hide sections initially */

        #unitSection,
        #topicSection,
        #subtopicSection,
        #aiSection,
        #notesSection {
            display: none;
        }

        /* Back button */

        .back {
            background-color: #263238;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            margin-bottom: 15px;
            cursor: pointer;
        }

        .back:hover {
            background-color: #37474f;
        }

        /* AI button */

        .aiButton {
            background-color: #673ab7;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }

        .aiButton:hover {
            background-color: #512da8;
        }

        /* AI box */

        .aiBox {
            background-color: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #cccccc;
        }

        .aiBox h3 {
            margin-bottom: 12px;
        }

        .aiBox p {
            line-height: 1.6;
        }

        /* Teacher note */

        .teacherNote {
            background-color: #f5f5f5;
            padding: 18px;
            margin-top: 15px;
            border-radius: 8px;
            border-left: 5px solid #673ab7;
        }

        .teacherNote h3 {
            margin-bottom: 10px;
        }

        .teacherNote p {
            margin-bottom: 8px;
        }

        /* Complete button */

        .completeButton {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            margin-top: 15px;
            cursor: pointer;
            font-size: 15px;
        }

        .completeButton:hover {
            background-color: #388e3c;
        }

        .completeButton:disabled {
            background-color: #777;
            cursor: not-allowed;
        }

        /* Mobile */

        @media (max-width: 600px) {

            .grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 15px;
            }

        }

    </style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header>

    <h1>📚 EduMate</h1>

    <p>AI Powered Learning</p>

</header>


<div class="container">


    <!-- ==================================================
         SUBJECT SECTION
    ================================================== -->

    <div id="subjectSection">

        <h2>📚 Select Subject</h2>

        <div class="grid">


            <div class="card" onclick="showUnits('DBMS')">

                <h2>🗄️</h2>

                <h3>DBMS</h3>

            </div>


            <div class="card" onclick="showUnits('DLD')">

                <h2>💡</h2>

                <h3>DLD</h3>

            </div>


            <div class="card" onclick="showUnits('C++')">

                <h2>💻</h2>

                <h3>C++</h3>

            </div>


            <div class="card" onclick="showUnits('JavaScript')">

                <h2>🌐</h2>

                <h3>JavaScript</h3>

            </div>


            <div class="card" onclick="showUnits('C')">

                <h2>🔵</h2>

                <h3>C Programming</h3>

            </div>


            <div class="card" onclick="showUnits('Networks')">

                <h2>🌐</h2>

                <h3>Computer Networks</h3>

            </div>


        </div>

    </div>



    <!-- ==================================================
         UNIT SECTION
    ================================================== -->

    <div id="unitSection">

        <button class="back" onclick="backToSubjects()">
            ← Subjects
        </button>

        <h2 id="unitTitle"></h2>

        <div id="units" class="grid"></div>

    </div>



    <!-- ==================================================
         TOPIC SECTION
    ================================================== -->

    <div id="topicSection">

        <button class="back" onclick="backToUnits()">
            ← Units
        </button>

        <h2 id="topicTitle"></h2>

        <div id="topics" class="grid"></div>

    </div>



    <!-- ==================================================
         SUBTOPIC SECTION
    ================================================== -->

    <div id="subtopicSection">

        <button class="back" onclick="backToTopics()">
            ← Topics
        </button>

        <h2 id="subtopicTitle"></h2>

        <div id="subtopics" class="grid"></div>

    </div>



    <!-- ==================================================
         AI SECTION
    ================================================== -->

    <div id="aiSection">

        <button class="back" onclick="backToSubtopics()">
            ← Subtopics
        </button>

        <h2 id="selectedSubtopic"></h2>


        <button
            class="aiButton"
            onclick="getAIExplanation()"
        >
            🤖 Explain with AI
        </button>


        <div class="aiBox">

            <h3>📖 AI Explanation</h3>

            <p id="aiResult">
                Select a subtopic and click
                "Explain with AI".
            </p>

        </div>

    </div>



    <!-- ==================================================
         TEACHER NOTES SECTION
    ================================================== -->

    <div id="notesSection">

        <button class="back" onclick="backToSubtopics()">
            ← Subtopics
        </button>

        <h2>📚 Teacher Notes</h2>

        <div id="teacherNotes"></div>

    </div>


</div>



<script>


/* ==================================================
   LOGIN CHECK
================================================== */

let currentUser =
    JSON.parse(localStorage.getItem("currentUser"));

if (!currentUser) {

    window.location.href = "index.html";

}



/* ==================================================
   LEARNING DATA
================================================== */

let data = {

    DBMS: {

        "Unit 1 - Database Fundamentals": {

            "DBMS": [
                "Definition",
                "Advantages",
                "Disadvantages",
                "Applications"
            ],

            "Database": [
                "Definition",
                "Types of Database",
                "Database Examples"
            ],

            "DBMS Architecture": [
                "1-Tier Architecture",
                "2-Tier Architecture",
                "3-Tier Architecture"
            ]

        },


        "Unit 2 - SQL": {

            "SQL": [
                "Definition",
                "Advantages",
                "Types of SQL Commands"
            ],

            "DDL": [
                "CREATE",
                "ALTER",
                "DROP",
                "TRUNCATE"
            ],

            "DML": [
                "INSERT",
                "UPDATE",
                "DELETE"
            ]

        },


        "Unit 3 - Keys": {

            "Keys": [
                "Primary Key",
                "Foreign Key",
                "Candidate Key",
                "Super Key"
            ]

        }

    },


    DLD: {

        "Unit 1 - Boolean Algebra": {

            "Boolean Algebra": [
                "Definition",
                "Basic Laws",
                "Boolean Expressions"
            ],

            "Logic Gates": [
                "AND Gate",
                "OR Gate",
                "NOT Gate",
                "NAND Gate",
                "NOR Gate"
            ]

        }

    },


    "C++": {

        "Unit 1 - OOP": {

            "Object Oriented Programming": [
                "Definition",
                "Features",
                "Advantages"
            ],

            "Class": [
                "Definition",
                "Syntax",
                "Example"
            ],

            "Object": [
                "Definition",
                "Creation",
                "Example"
            ]

        }

    },


    JavaScript: {

        "Unit 1 - JavaScript Basics": {

            "Variables": [
                "var",
                "let",
                "const"
            ],

            "Data Types": [
                "Number",
                "String",
                "Boolean",
                "Object"
            ],

            "Events": [
                "onclick",
                "onmouseover",
                "onfocus",
                "onsubmit"
            ]

        }

    },


    C: {

        "Unit 1 - C Basics": {

            "Variables": [
                "Definition",
                "Declaration",
                "Initialization"
            ],

            "Functions": [
                "Definition",
                "Types",
                "Function Call"
            ]

        }

    },


    Networks: {

        "Unit 1 - Networking Basics": {

            "Computer Network": [
                "Definition",
                "Advantages",
                "Types"
            ],

            "LAN": [
                "Definition",
                "Characteristics",
                "Applications"
            ],

            "WAN": [
                "Definition",
                "Characteristics",
                "Applications"
            ]

        }

    }

};



/* ==================================================
   VARIABLES
================================================== */

let selectedSubject = "";

let selectedUnit = "";

let selectedTopic = "";

let selectedSubtopic = "";



/* ==================================================
   SHOW UNITS
================================================== */

function showUnits(subject) {

    selectedSubject = subject;

    document.getElementById("subjectSection").style.display =
        "none";

    document.getElementById("unitSection").style.display =
        "block";

    document.getElementById("topicSection").style.display =
        "none";

    document.getElementById("subtopicSection").style.display =
        "none";

    document.getElementById("aiSection").style.display =
        "none";

    document.getElementById("notesSection").style.display =
        "none";


    document.getElementById("unitTitle").innerHTML =
        "📖 " + subject + " - Select Unit";


    let unitList =
        document.getElementById("units");

    unitList.innerHTML = "";


    for (let unit in data[subject]) {

        let card =
            document.createElement("div");

        card.className = "card";

        card.innerHTML =
            "<h3>📘 " + unit + "</h3>";

        card.onclick = function() {

            showTopics(unit);

        };

        unitList.appendChild(card);

    }

}



/* ==================================================
   SHOW TOPICS
================================================== */

function showTopics(unit) {

    selectedUnit = unit;

    document.getElementById("unitSection").style.display =
        "none";

    document.getElementById("topicSection").style.display =
        "block";

    document.getElementById("subtopicSection").style.display =
        "none";

    document.getElementById("aiSection").style.display =
        "none";

    document.getElementById("notesSection").style.display =
        "none";


    document.getElementById("topicTitle").innerHTML =
        "📚 " + unit + " - Select Topic";


    let topicList =
        document.getElementById("topics");

    topicList.innerHTML = "";


    for (let topic in data[selectedSubject][unit]) {

        let card =
            document.createElement("div");

        card.className = "card";

        card.innerHTML =
            "<h3>📌 " + topic + "</h3>";

        card.onclick = function() {

            showSubtopics(topic);

        };

        topicList.appendChild(card);

    }

}



/* ==================================================
   SHOW SUBTOPICS
================================================== */

function showSubtopics(topic) {

    selectedTopic = topic;

    document.getElementById("topicSection").style.display =
        "none";

    document.getElementById("subtopicSection").style.display =
        "block";

    document.getElementById("aiSection").style.display =
        "none";

    document.getElementById("notesSection").style.display =
        "none";


    document.getElementById("subtopicTitle").innerHTML =
        "📌 " + topic + " - Select Subtopic";


    let subtopicList =
        document.getElementById("subtopics");

    subtopicList.innerHTML = "";


    let list =
        data[selectedSubject][selectedUnit][selectedTopic];


    for (let i = 0; i < list.length; i++) {

        let card =
            document.createElement("div");

        card.className = "card";

        card.innerHTML =
            "<h3>🔹 " + list[i] + "</h3>";

        card.onclick = function() {

            showAIScreen(list[i]);

        };

        subtopicList.appendChild(card);

    }

}



/* ==================================================
   SHOW AI SCREEN
================================================== */

function showAIScreen(subtopic) {

    selectedSubtopic = subtopic;


    document.getElementById("subtopicSection").style.display =
        "none";

    document.getElementById("aiSection").style.display =
        "block";

    document.getElementById("notesSection").style.display =
        "block";


    document.getElementById("selectedSubtopic").innerHTML =
        "🤖 " +
        selectedTopic +
        " → " +
        selectedSubtopic;


    document.getElementById("aiResult").innerHTML =
        "Click the button above to generate an AI explanation.";


    /* =========================
       SHOW TEACHER NOTES
    ========================= */

    showTeacherNotes();


    /* =========================
       CREATE COMPLETE BUTTON
    ========================= */

    let completeButton =
        document.getElementById("completeButton");


    if (!completeButton) {

        completeButton =
            document.createElement("button");

        completeButton.id =
            "completeButton";

        completeButton.className =
            "completeButton";

        completeButton.innerHTML =
            "✅ Mark as Completed";

        completeButton.onclick =
            markAsCompleted;

        document.getElementById("aiSection")
            .appendChild(completeButton);

    }


    /* =========================
       CHECK COMPLETION
    ========================= */

    let completed =
        JSON.parse(
            localStorage.getItem(
                "completedTopics_" + currentUser.email
            )
        ) || [];


    let key =
        selectedSubject + "_" +
        selectedUnit + "_" +
        selectedTopic + "_" +
        selectedSubtopic;


    if (completed.includes(key)) {

        completeButton.innerHTML =
            "✅ Completed";

        completeButton.disabled = true;

    } else {

        completeButton.innerHTML =
            "✅ Mark as Completed";

        completeButton.disabled = false;

    }

}



/* ==================================================
   MARK AS COMPLETED
================================================== */

function markAsCompleted() {

    let currentUser =
        JSON.parse(localStorage.getItem("currentUser"));


    if (!currentUser) {

        window.location.href = "index.html";

        return;

    }


    /* Get existing progress */

    let allProgress =
        JSON.parse(
            localStorage.getItem("learnProgress")
        ) || {};


    /* Create progress for student */

    if (!allProgress[currentUser.email]) {

        allProgress[currentUser.email] = 0;

    }


    /* Calculate total subtopics */

    let totalSubtopics = 0;


    for (let subject in data) {

        for (let unit in data[subject]) {

            for (let topic in data[subject][unit]) {

                totalSubtopics +=
                    data[subject][unit][topic].length;

            }

        }

    }


    /* Get completed topics for this student */

    let completedTopics =
        JSON.parse(
            localStorage.getItem(
                "completedTopics_" + currentUser.email
            )
        ) || [];


    /* Create unique topic key */

    let topicKey =
        selectedSubject + "_" +
        selectedUnit + "_" +
        selectedTopic + "_" +
        selectedSubtopic;


    /* Add if not already completed */

    if (!completedTopics.includes(topicKey)) {

        completedTopics.push(topicKey);

    }


    /* Save completed topics */

    localStorage.setItem(
        "completedTopics_" + currentUser.email,
        JSON.stringify(completedTopics)
    );


    /* Calculate percentage */

    let progress =
        Math.round(
            (completedTopics.length /
                totalSubtopics) * 100
        );


    /* Save progress */

    allProgress[currentUser.email] =
        progress;


    localStorage.setItem(
        "learnProgress",
        JSON.stringify(allProgress)
    );


    /* Change button */

    let completeButton =
        document.getElementById("completeButton");

    if (completeButton) {

        completeButton.innerHTML =
            "✅ Completed";

        completeButton.disabled =
            true;

    }


    alert(
        "Topic completed! 🎉\nYour Learning Progress: " +
        progress +
        "%"
    );

}



/* ==================================================
   AI EXPLANATION
================================================== */

function getAIExplanation() {

    /*
        This is currently a demo.

        Later:
        JavaScript → PHP → AI API
    */


    document.getElementById("aiResult").innerHTML =

        "AI explanation will appear here.<br><br>" +

        "<b>Subject:</b> " +
        selectedSubject +
        "<br>" +

        "<b>Unit:</b> " +
        selectedUnit +
        "<br>" +

        "<b>Topic:</b> " +
        selectedTopic +
        "<br>" +

        "<b>Subtopic:</b> " +
        selectedSubtopic;

}



/* ==================================================
   SHOW TEACHER NOTES
================================================== */

function showTeacherNotes() {

    let notes =
        JSON.parse(
            localStorage.getItem("notes")
        ) || [];


    let noteBox =
        document.getElementById("teacherNotes");


    noteBox.innerHTML = "";


    let found = false;


    for (let i = 0; i < notes.length; i++) {

        /*
            Show notes belonging to
            the selected subject.
        */

        if (notes[i].subject == selectedSubject) {

            found = true;


            let div =
                document.createElement("div");


            div.className =
                "teacherNote";


            div.innerHTML =

                "<h3>📖 " +
                notes[i].title +
                "</h3>" +

                "<p><b>Subject:</b> " +
                notes[i].subject +
                "</p>" +

                "<p>" +
                notes[i].content +
                "</p>" +

                "<p><small>👩‍🏫 Added by: " +
                notes[i].teacher +
                "</small></p>";


            noteBox.appendChild(div);

        }

    }


    if (!found) {

        noteBox.innerHTML =

            "<div class='teacherNote'>" +

            "<p>📭 No teacher notes available for this subject.</p>" +

            "</div>";

    }

}



/* ==================================================
   BACK TO SUBJECTS
================================================== */

function backToSubjects() {

    document.getElementById("unitSection").style.display =
        "none";

    document.getElementById("subjectSection").style.display =
        "block";

    document.getElementById("topicSection").style.display =
        "none";

    document.getElementById("subtopicSection").style.display =
        "none";

    document.getElementById("aiSection").style.display =
        "none";

    document.getElementById("notesSection").style.display =
        "none";

}



/* ==================================================
   BACK TO UNITS
================================================== */

function backToUnits() {

    document.getElementById("topicSection").style.display =
        "none";

    document.getElementById("unitSection").style.display =
        "block";

    document.getElementById("subtopicSection").style.display =
        "none";

    document.getElementById("aiSection").style.display =
        "none";

    document.getElementById("notesSection").style.display =
        "none";

}



/* ==================================================
   BACK TO TOPICS
================================================== */

function backToTopics() {

    document.getElementById("subtopicSection").style.display =
        "none";

    document.getElementById("topicSection").style.display =
        "block";

    document.getElementById("aiSection").style.display =
        "none";

    document.getElementById("notesSection").style.display =
        "none";

}



/* ==================================================
   BACK TO SUBTOPICS
================================================== */

function backToSubtopics() {

    document.getElementById("aiSection").style.display =
        "none";

    document.getElementById("notesSection").style.display =
        "none";

    document.getElementById("subtopicSection").style.display =
        "block";

}


</script>


</body>

</html>
